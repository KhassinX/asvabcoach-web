name: Build preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Sin esto, cada push a una rama con PR abierto deja corriendo el run
# anterior hasta el final: varios builds completos para un solo resultado
# util, el ultimo. En main no se cancela — ahi cada commit merece su
# verificacion — por eso el grupo incluye la ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Build site
        run: jekyll build --strict_front_matter --safe --verbose

      - name: HTML5 validation
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: _site/
          log_level: WARNING
