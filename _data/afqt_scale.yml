# SUBCONJUNTO del export del monorepo (`web/_data/afqt_scale.yml` @ d011d339):
# sólo lo que las páginas /scores/ y la calculadora publican — la fórmula del DoD y
# las seis bandas de categoría con su descripción. Las demás claves de ese export
# (la curva interna con la que la app estima, su rango y su frase de procedencia)
# describen la app que todavía no salió y no las lee ninguna página de este sitio.
