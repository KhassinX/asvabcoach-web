en:
  h1: "Private AI Tutor for the ASVAB."
  lead: "iPhone, iPad, Mac, Apple Watch. Free to start. One‑time unlock, no subscription."
  badge_alt: "Download on the App Store"
  facts_label: "Privacy at a glance"
  facts:
    - "Data Not Collected"
    - "No account"
    - "On‑device AI"
  afqt_label: "AFQT"
  line_label: "Line scores"
  scores_caption: "725 curated questions across all 9 ASVAB score areas, with worked solutions."
  privacy_h: "Privacy"
  manifest:
    - { k: "Data collected", v: "None. App Store label: “Data Not Collected”" }
    - { k: "Account", v: "None" }
    - { k: "Where your data lives", v: "On your device, synced through your iCloud" }
    - { k: "Tracking", v: "None" }
    - { k: "AI", v: "Apple’s on‑device model, on supported iPhone and iPad models with Apple Intelligence" }
    - { k: "Price", v: "Free to start; one‑time Full Access unlock" }
  policy: "Privacy Policy"
  reach: "What does reach us: crash reports and usage information, if you chose in your device settings to share them with app developers (Apple passes them on), and the emails you send us."
  inside_h: "What’s inside"
  inside:
    - { k: "Diagnostic", v: "20 questions to estimate your AFQT baseline" }
    - { k: "Momentum", v: "A single Daily Goal ring (Gentle, Standard, or Intense), respectful streaks with a built-in grace day, 17 achievements, and an optional exam-date countdown. Build the habit without the pressure." }
    - { k: "Smart Review study plan", v: "SM-2 algorithm, ASVAB-calibrated per category. Review what you forget, not what you know." }
    - { k: "725 curated questions", v: "Across all 9 ASVAB score areas, with worked solutions, modeled on the public ASVAB format" }
    - { k: "AFQT Sprint", v: "Timed practice to build test-taking endurance" }
    - { k: "Smart Exam", v: "Full-length simulated CAT-ASVAB" }
    - { k: "Apple Watch companion", v: "Vocab review and quick-10 sessions on your wrist" }
    - { k: "Mac", v: "The iPad app, in a window on a Mac with Apple silicon" }
    - { k: "Math step-by-step solver", v: "With worked solutions" }
  bands:
    - id: recruits
      h: "Built for serious recruits"
      lead: "For high school graduates and adult learners targeting all six U.S. military branches: Army, Navy, Marines, Air Force, Coast Guard, and Space Force."
      # audit-allow:N22 superficie publica: el numero se imprime a proposito. Verificado contra ASVABCoach/BranchManager.swift el 2026-09-01. Si cambia un piso, esta linea se reescribe a mano.
      body: "Branch-neutral by design: no Army-only or Navy-only bias. Whether you’re aiming for a minimum AFQT (Army 31, Navy 31, Marines 31, Air Force 31, Space Force 31, Coast Guard 32) or chasing a competitive score for a specific MOS or rating, the app adapts to your level via spaced repetition and Apple Intelligence-powered explanations."
  faq_h: "Frequently asked questions"
  # audit-allow:N22 FAQ publica: la primera respuesta enumera los pisos a proposito (rich result de Google). Verificada contra BranchManager.swift el 2026-09-01.
  faq:
    - q: "What AFQT score do I need to enlist?"
      a: "The AFQT is a percentile from 1 to 99, calculated from four ASVAB subtests: Arithmetic Reasoning, Word Knowledge, Paragraph Comprehension, and Mathematics Knowledge. Current branch minimums are Army 31, Navy 31, Marine Corps 31, Air Force 31, Space Force 31 and Coast Guard 32 (checked on 5 September 2026 against each branch’s published requirements); competitive jobs usually need more. ASVAB Coach estimates your AFQT from a 20-question diagnostic and tracks it as you study."
    - q: "Is ASVAB Coach free?"
      a: "Yes, free to start, with no account and no subscription. You can answer 50 questions from any category, take a complete diagnostic and the Quick 10 (neither counts against the 50), and use the on‑device AI tutor for free. A single one‑time unlock (never a subscription) adds all 725 questions and the full CAT-ASVAB mock exam. The same purchase applies on iPhone, iPad, Apple Watch, and Mac. Family Sharing is included."
    - q: "How long should I study for the ASVAB?"
      a: "It depends on your starting point and target score, but most candidates prepare over a few weeks. ASVAB Coach builds a spaced-repetition plan (the SM-2 algorithm) that brings back what you’re about to forget, and the Momentum system (a Daily Goal ring and forgiving streaks with a grace day) helps you keep a steady habit instead of cramming."
    - q: "What does the ASVAB cover?"
      a: "The ASVAB is 10 separately timed tests, reported as nine scores: Auto Information and Shop Information are given as separate tests and combined into a single Auto & Shop (AS) score. Four of those scores make up your AFQT (Arithmetic Reasoning, Word Knowledge, Paragraph Comprehension, Mathematics Knowledge); the others (General Science, Electronics Information, Auto & Shop Information, Mechanical Comprehension, and Assembling Objects) set the line scores for specific jobs. ASVAB Coach covers all nine with 725 curated questions and worked solutions."
    - q: "Is my study data private?"
      a: "Yes. ASVAB Coach has no account, no analytics SDKs, and no tracking. The AI tutor runs on your device with Apple Intelligence, on supported iPhone and iPad models. Your progress lives on your device and syncs through your own iCloud."
    - q: "Does it work on Apple Watch and Mac?"
      a: "Yes. The Apple Watch app works together with the iPhone app: do Quick 10 reviews on your wrist. On a Mac with Apple silicon, the iPad app runs in a window. The AI tutor runs on supported iPhone and iPad models. Your progress syncs across devices through your private iCloud."
