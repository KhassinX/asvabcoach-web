  inside:
    - { k: "Diagnóstico", v: "20 preguntas para estimar tu nivel base AFQT" }
    - { k: "Momentum", v: "Un único anillo de meta diaria (Suave, Estándar o Intensa), rachas respetuosas con día de gracia, 17 logros y una cuenta regresiva opcional para tu examen. Crea el hábito sin presión." }
    - { k: "Plan de estudio con Repaso inteligente", v: "Algoritmo SM-2, calibrado por categoría ASVAB. Repasa lo que olvidas, no lo que ya dominas." }
    - { k: "725 preguntas seleccionadas", v: "En las 9 áreas de score del ASVAB, con soluciones explicadas paso a paso, modeladas sobre el formato público del ASVAB" }
