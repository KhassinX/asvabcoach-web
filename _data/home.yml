    - { k: "Matemáticas paso a paso", v: "Resolución con explicaciones detalladas" }
  bands:
    - id: recruits
      h: "Hecha para reclutas serios"
      lead: "Para graduados de secundaria y adultos que apuntan a las seis ramas militares de EE. UU.: Army, Navy, Marines, Air Force, Coast Guard y Space Force."
      # audit-allow:N22 superficie publica: el numero se imprime a proposito. Verificado contra ASVABCoach/BranchManager.swift el 2026-09-01. Si cambia un piso, esta linea se reescribe a mano.
      body: "Neutral por diseño: sin sesgo hacia ninguna rama. Ya sea que apuntes al mínimo AFQT (Army 31, Navy 31, Marines 31, Air Force 31, Space Force 31, Coast Guard 32) o estés persiguiendo un puntaje competitivo para un MOS o rating específico, la app se adapta a tu nivel vía repetición espaciada y explicaciones generadas con Apple Intelligence."
  faq_h: "Preguntas frecuentes"
  # audit-allow:N22 FAQ publica: la primera respuesta enumera los pisos a proposito (rich result de Google). Verificada contra BranchManager.swift el 2026-09-01.
  faq:
    - q: "¿Qué puntaje AFQT necesito para enlistarme?"
      a: "El AFQT es un percentil del 1 al 99, calculado a partir de cuatro subtests del ASVAB: Razonamiento Aritmético, Conocimiento de Vocabulario, Comprensión de Lectura y Conocimiento Matemático. Los mínimos por rama son Army 31, Navy 31, Marine Corps 31, Air Force 31, Space Force 31 y Coast Guard 32 (revisados el 5 de septiembre de 2026 contra los requisitos publicados de cada rama); los empleos competitivos suelen pedir más. ASVAB Coach estima tu AFQT con un diagnóstico de 20 preguntas y lo sigue a medida que estudias."
    - q: "¿ASVAB Coach es gratis?"
      a: "Sí, gratis para empezar, sin cuenta y sin suscripción. Puedes responder 50 preguntas de cualquier categoría, hacer un diagnóstico completo y el Quick 10 (ninguno descuenta de las 50), y usar el tutor de IA en el dispositivo gratis. Un único desbloqueo (nunca una suscripción) agrega las 725 preguntas y el simulacro CAT-ASVAB completo. La misma compra vale en iPhone, iPad, Apple Watch y Mac. Family Sharing incluido."
    - q: "¿Cuánto tiempo debo estudiar para el ASVAB?"
      a: "Depende de tu punto de partida y tu puntaje objetivo, pero la mayoría se prepara durante algunas semanas. ASVAB Coach arma un plan de repetición espaciada (el algoritmo SM-2) que trae de vuelta lo que estás por olvidar, y el sistema Momentum (un anillo de meta diaria y rachas que perdonan con día de gracia) te ayuda a mantener un hábito constante en vez de estudiar a último momento."
    - q: "¿Qué cubre el ASVAB?"
      a: "El ASVAB son 10 tests cronometrados por separado, y se reportan como nueve scores: Información de Automóviles e Información de Taller se rinden aparte y se combinan en un único score, Información de Auto y Taller (AS). Cuatro de esos scores forman tu AFQT (Razonamiento Aritmético, Conocimiento de Vocabulario, Comprensión de Lectura, Conocimiento Matemático); los demás (Ciencias Generales, Información de Electrónica, Información de Auto y Taller, Comprensión Mecánica y Ensamblaje de Objetos) definen los line scores para empleos específicos. ASVAB Coach cubre los nueve con 725 preguntas seleccionadas y soluciones explicadas."
    - q: "¿Mis datos de estudio son privados?"
      a: "Sí. ASVAB Coach no tiene cuenta, ni SDKs de analytics, ni rastreo. El tutor de IA corre en tu dispositivo con Apple Intelligence, en modelos compatibles de iPhone y iPad. Tu progreso vive en tu dispositivo y se sincroniza por tu propio iCloud."
    - q: "¿Funciona en Apple Watch y Mac?"
      a: "Sí. La app de Apple Watch funciona junto con la app del iPhone: haz repasos rápidos de 10 preguntas en tu muñeca. En un Mac con Apple silicon, la app de iPad corre en una ventana. El tutor de IA corre en modelos compatibles de iPhone y iPad. Tu progreso se sincroniza entre dispositivos por tu iCloud privado."
