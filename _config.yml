title: ASVAB Coach
description: Private AI tutor for the ASVAB. Apple Intelligence on-device, native Apple Watch, zero tracking. $4.99 once.
url: https://asvab.khassinx.com
lang: en

# Layer 2 brand tokens (ASVAB Coach specific) extending Layer 3 primitives
app_tokens_css: /assets/css/asvab-tokens.css

# Favicons (derived from official Icon Composer .icon bundle 2026-05-27)
# Apple-canon: navy gradient #1E3A5F→#0F1F36 background + gold A #E5C079→#C9A050
favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

# Navigation — keyed por locale. El layout selecciona via page.lang con fallback a 'en'.
nav:
  en:
    - title: Legal
      url: /legal/
    - title: App Store
      url: https://apps.apple.com/us/app/asvab-coach/id6761384966
      external: true
  es:
    - title: Legal
      url: /es/legal/
    - title: App Store
      url: https://apps.apple.com/us/app/asvab-coach/id6761384966
      external: true

footer_nav:
  en:
    - title: Privacy
      url: /legal/privacy/
    - title: Terms
      url: /legal/terms/
    - title: Security
      url: /security/
    - title: Contact
      url: mailto:hello@khassinx.com
  es:
    - title: Privacidad
      url: /es/legal/privacy/
    - title: Términos
      url: /es/legal/terms/
    - title: Seguridad
      url: /es/security/
    - title: Contacto
      url: mailto:hello@khassinx.com

# Skip-link y "Part of ecosystem" copy por locale (lo consume base.html)
ui_strings:
  en:
    skip_to_main: "Skip to main content"
    part_of_ecosystem_prefix: "Part of the"
    part_of_ecosystem_label: "KhassinX ecosystem"
    ecosystem_url: "https://khassinx.com"
  es:
    skip_to_main: "Saltar al contenido principal"
    part_of_ecosystem_prefix: "Parte del"
    part_of_ecosystem_label: "ecosistema KhassinX"
    ecosystem_url: "https://khassinx.com/es/"

# Jekyll config
markdown: kramdown
plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - CONTRIBUTING.md
  - .gitignore
  - LICENSE

# Jekyll por default ignora dotfiles/dotdirs. .well-known DEBE servirse
# (RFC 9116 security.txt requiere path exacto /.well-known/security.txt).
include:
  - .well-known
