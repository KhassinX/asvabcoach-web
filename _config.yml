title: ASVAB Coach
description: Private AI tutor for the ASVAB. Apple Intelligence on-device; native iPhone, iPad, Apple Watch & Mac. 725 curated questions, spaced repetition, zero tracking. Free to start, one-time unlock.
url: https://asvab.khassinx.com
lang: en

# Legal entity (KHASSINX LLC — Florida single-member LLC, filed 2026-06-01)
org_legal_name: "KHASSINX LLC"
org_founding_date: "2026-06-01"

